# Render Blueprint for the Spring Boot backend.
# In Render: New → Blueprint → connect this repo. Render reads this file and
# provisions the service. The frontend deploys separately on Vercel (web/).
services:
  - type: web
    name: upi-offline-mesh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Set after the Vercel URL is known. A wildcard like https://*.vercel.app
      # also covers Vercel's per-deploy preview URLs. Comma-separated for more.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
