# Active via SPRING_PROFILES_ACTIVE=prod on the deployment host (Render, etc.)

# Render (and most PaaS hosts) inject the port to bind via $PORT.
server.port=${PORT:8080}

# Set to the deployed Vercel URL(s), comma-separated, via the
# CORS_ALLOWED_ORIGINS env var — e.g. https://upi-mesh.vercel.app
upi.mesh.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# This is a demo: H2 in-memory reseeding on every restart is intentional.
# The H2 console is a debug tool and shouldn't be reachable in a public deploy.
spring.h2.console.enabled=false

logging.level.com.demo.upimesh=INFO
